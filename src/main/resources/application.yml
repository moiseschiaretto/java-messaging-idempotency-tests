# application.yml
#
# Configuracao principal da aplicacao. Os valores de conexao (host, porta,
# usuario, senha) casam com o docker-compose.yml, usado quando a aplicacao
# roda localmente. Nos testes automatizados, esses valores sao sobrescritos
# em tempo de execucao pelo Testcontainers (ver AbstractIntegrationTest.java),
# entao este arquivo nunca e usado durante os testes.

spring:
  application:
    name: java-messaging-idempotency-tests

  # ---------- Banco de dados (Postgres) ----------
  datasource:
    url: jdbc:postgresql://localhost:5432/messaging_db
    username: messaging_user
    password: messaging_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' e aceitavel para um projeto de portfolio local; em um
      # ambiente real de producao o correto seria usar uma ferramenta de
      # migration (Flyway/Liquibase) com ddl-auto: validate
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Registra o tempo gasto em cada consulta — util para depurar o
        # cenario de consistencia sob volume (200-500 mensagens)
        generate_statistics: false

  # ---------- Kafka ----------
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: messaging-idempotency-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.moises.messaging.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all: so confirma a publicacao apos todas as replicas confirmarem.
      # Em cluster de 1 broker (nosso caso local) equivale a acks=1, mas
      # deixa o codigo correto caso o cluster cresca.
      acks: all
    listener:
      # Habilita o commit manual apos processamento bem sucedido, para nao
      # perder mensagens em caso de falha durante o processamento
      ack-mode: manual

  # ---------- Redis (cache) ----------
  data:
    redis:
      host: localhost
      port: 6379

# ---------- Configuracoes proprias da aplicacao ----------
messaging:
  kafka:
    topic-orders: orders-topic
    topic-orders-dlq: orders-topic.DLQ
    # Numero de tentativas de reprocessamento antes de rotear para a DLQ
    max-retry-attempts: 3
    # Intervalo entre tentativas (milissegundos)
    retry-backoff-ms: 1000
  cache:
    # Tempo de vida do cache de pedidos, em segundos
    order-ttl-seconds: 300

# ---------- Actuator / Micrometer (observabilidade) ----------
management:
  endpoints:
    web:
      exposure:
        # Expoe apenas o necessario; nunca expor tudo (/actuator/*) em produção
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ---------- Logging ----------
logging:
  level:
    root: INFO
    com.moises.messaging: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
